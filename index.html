<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KeepAPP</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --drawer-bg: #182234;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }

    /* Header y Menú Hamburguesa */
    header {
      background: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .menu-btn {
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }

    .header-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--accent);
      margin: 0;
    }

    /* Drawer / Sidebar */
    .drawer-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 200;
    }

    .drawer-overlay.active { opacity: 1; pointer-events: auto; }

    .drawer {
      position: fixed;
      top: 0; left: -280px;
      width: 280px; height: 100%;
      background: var(--drawer-bg);
      z-index: 201;
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
      padding: 20px 0;
    }

    .drawer.active { transform: translateX(280px); }

    .drawer-header {
      padding: 0 20px 20px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--accent);
    }

    .drawer-menu { list-style: none; padding: 0; margin: 10px 0 0 0; }

    .drawer-menu li a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 1rem;
      transition: background 0.2s, color 0.2s;
    }

    .drawer-menu li a.active, .drawer-menu li a:hover {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border-left: 4px solid var(--accent);
    }

    /* Vistas Principales */
    main { padding: 16px; padding-bottom: 40px; }
    .section-view { display: none; }
    .section-view.active { display: block; }

    /* Sub-Navegación BBM (Tabs) */
    .bbm-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      background: var(--card-bg);
      padding: 6px;
      border-radius: 10px;
    }

    .bbm-tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-dim);
      padding: 8px 0;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }

    .bbm-tab-btn.active {
      background: var(--accent);
      color: var(--bg);
    }

    .bbm-subview { display: none; }
    .bbm-subview.active { display: block; }

    /* Tarjetas y Controles */
    .day-select {
      width: 100%;
      padding: 10px;
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .card-title { margin: 0 0 6px 0; font-size: 1rem; color: var(--text); }
    .card-subtitle { font-size: 0.85rem; color: var(--accent); margin-bottom: 4px; }
    .card-meta { font-size: 0.75rem; color: var(--text-dim); }

    .records-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .record-box {
      background: rgba(255, 255, 255, 0.05);
      padding: 8px;
      border-radius: 6px;
      text-align: center;
    }

    .record-val { font-size: 1.1rem; font-weight: bold; color: #4ade80; }
    .record-lbl { font-size: 0.65rem; color: var(--text-dim); }
  </style>
</head>
<body>

  <header>
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <h1 class="header-title" id="currentSectionTitle">🏋️ BBM (Gym)</h1>
    <div style="width: 24px;"></div>
  </header>

  <div class="drawer-overlay" id="overlay" onclick="toggleMenu()"></div>
  <nav class="drawer" id="drawer">
    <div class="drawer-header">📌 Menú principal</div>
    <ul class="drawer-menu">
      <li><a href="#" onclick="navigate('estudio', 'Estudio')">Estudio</a></li>
      <li><a href="#" onclick="navigate('tareas', 'Tareas')">Tareas</a></li>
      <li><a href="#" onclick="navigate('compras', 'Compras')">Compras</a></li>
      <li><a href="#" onclick="navigate('gastos', 'Gastos')">Gastos</a></li>
      <li><a href="#" id="link-bbm" class="active" onclick="navigate('bbm', 'BBM (Gym)')">BBM (Gym)</a></li>
      <li><a href="#" onclick="navigate('links', 'Links')">Links</a></li>
    </ul>
  </nav>

  <main>
    <!-- Módulo BBM -->
    <section id="view-bbm" class="section-view active">
      <div class="bbm-tabs">
        <button class="bbm-tab-btn active" onclick="switchBBMTab('ejercicios')">Ejercicios</button>
        <button class="bbm-tab-btn" onclick="switchBBMTab('records')">Récords</button>
        <button class="bbm-tab-btn" onclick="switchBBMTab('medidas')">Medidas</button>
      </div>

      <!-- Sub-vista 1: Ejercicios -->
      <div id="bbm-ejercicios" class="bbm-subview active">
        <select id="daySelector" class="day-select" onchange="renderizarEjerciciosPorDia()">
          <option value="Lunes">Lunes</option>
          <option value="Martes">Martes</option>
          <option value="Miércoles">Miércoles</option>
          <option value="Jueves">Jueves</option>
          <option value="Viernes">Viernes</option>
          <option value="Sábado">Sábado</option>
          <option value="Domingo">Domingo</option>
        </select>
        <div id="exerciseList">Cargando ejercicios...</div>
      </div>

      <!-- Sub-vista 2: Récords -->
      <div id="bbm-records" class="bbm-subview">
        <div id="recordsList">Cargando récords...</div>
      </div>

      <!-- Sub-vista 3: Medidas -->
      <div id="bbm-medidas" class="bbm-subview">
        <div id="medidasList">Cargando medidas...</div>
      </div>
    </section>

    <section id="view-estudio" class="section-view"><p>Módulo de Estudio...</p></section>
    <section id="view-tareas" class="section-view"><p>Módulo de Tareas...</p></section>
    <section id="view-compras" class="section-view"><p>Módulo de Compras...</p></section>
    <section id="view-gastos" class="section-view"><p>Módulo de Gastos...</p></section>
    <section id="view-links" class="section-view"><p>Módulo de Links...</p></section>
  </main>

  <script>
    const SHEET_ID = "1jw9T6byYopO1uOX3iDTtD_9DFvl_2LaC-tT-Qgsu7kw";
    
    // URLs para cada pestaña de BBM
    const URL_RUTINA = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=bbm_rutina`;
    const URL_RECORDS = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=bbm_records`;
    const URL_MEDIDAS = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=bbm_medidas`;

    let datosRutina = [];

    // Menú Hamburguesa
    function toggleMenu() {
      document.getElementById("drawer").classList.toggle("active");
      document.getElementById("overlay").classList.toggle("active");
    }

    function navigate(sectionId, titleText) {
      document.querySelectorAll(".section-view").forEach(s => s.classList.remove("active"));
      document.querySelectorAll(".drawer-menu a").forEach(a => a.classList.remove("active"));

      document.getElementById(`view-${sectionId}`).classList.add("active");
      document.getElementById("currentSectionTitle").innerText = titleText;
      toggleMenu();
    }

    // Sub-navegación BBM Tabs
    function switchBBMTab(tabName) {
      document.querySelectorAll(".bbm-tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".bbm-subview").forEach(v => v.classList.remove("active"));

      event.target.classList.add("active");
      document.getElementById(`bbm-${tabName}`).classList.add("active");
    }

    // Seleccionar día actual al iniciar
    function setDiaActual() {
      const dias = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
      const hoy = dias[new Date().getDay()];
      const select = document.getElementById("daySelector");
      if (select) select.value = hoy;
    }

    // Cargar Rutinas
    function cargarRutina() {
      const url = `${URL_RUTINA}&_nocache=${new Date().getTime()}`;
      Papa.parse(url, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          datosRutina = results.data;
          renderizarEjerciciosPorDia();
        }
      });
    }

    function renderizarEjerciciosPorDia() {
      const diaSeleccionado = document.getElementById("daySelector").value;
      const contenedor = document.getElementById("exerciseList");
      contenedor.innerHTML = "";

      const ejercicios = datosRutina.filter(e => e.Dia === diaSeleccionado);

      if (ejercicios.length === 0) {
        contenedor.innerHTML = "<p style='color: var(--text-dim); text-align: center;'>No hay ejercicios programados para este día.</p>";
        return;
      }

      ejercicios.forEach(e => {
        contenedor.innerHTML += `
          <div class="card">
            <h3 class="card-title">${e.Ejercicio}</h3>
            <div class="card-subtitle">${e.Series} series × ${e.Repeticiones} reps</div>
            ${e.Notas ? `<div class="card-meta">📝 ${e.Notas}</div>` : ''}
          </div>
        `;
      });
    }

    // Cargar Récords
    function cargarRecords() {
      const url = `${URL_RECORDS}&_nocache=${new Date().getTime()}`;
      Papa.parse(url, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          const contenedor = document.getElementById("recordsList");
          contenedor.innerHTML = "";

          // Agrupar récords por Ejercicio
          const agrupados = {};
          results.data.forEach(r => {
            if (!agrupados[r.Ejercicio]) agrupados[r.Ejercicio] = {};
            agrupados[r.Ejercicio][r.Reps_Target] = r.Peso_Kg;
          });

          Object.keys(agrupados).forEach(ejercicio => {
            const recs = agrupados[ejercicio];
            contenedor.innerHTML += `
              <div class="card">
                <h3 class="card-title">${ejercicio}</h3>
                <div class="records-grid">
                  <div class="record-box">
                    <div class="record-val">${recs['1RM'] || '-'} kg</div>
                    <div class="record-lbl">1RM</div>
                  </div>
                  <div class="record-box">
                    <div class="record-val">${recs['3RM'] || '-'} kg</div>
                    <div class="record-lbl">3RM</div>
                  </div>
                  <div class="record-box">
                    <div class="record-val">${recs['10RM'] || '-'} kg</div>
                    <div class="record-lbl">10RM</div>
                  </div>
                </div>
              </div>
            `;
          });
        }
      });
    }

    // Cargar Medidas
    function cargarMedidas() {
      const url = `${URL_MEDIDAS}&_nocache=${new Date().getTime()}`;
      Papa.parse(url, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          const contenedor = document.getElementById("medidasList");
          contenedor.innerHTML = "";

          results.data.reverse().forEach(m => {
            contenedor.innerHTML += `
              <div class="card">
                <h3 class="card-title">📅 Registro: ${m.Fecha}</h3>
                <div class="card-subtitle">Peso: ${m.Peso_Kg} kg | Grasas: ${m['%_Grasa'] || '-'}%</div>
                <div class="card-meta" style="margin-top:6px;">
                  💪 Brazo: ${m.Brazo_Cm} cm | 📏 Pecho: ${m.Pecho_Cm} cm <br>
                  📐 Cintura: ${m.Cintura_Cm} cm | 🦵 Muslo: ${m.Muslo_Cm} cm
                </div>
              </div>
            `;
          });
        }
      });
    }

    // Inicialización
    setDiaActual();
    cargarRutina();
    cargarRecords();
    cargarMedidas();
  </script>
</body>
</html>
