<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi App - Panel de Control</title>
  
  <!-- CSS Principal -->
  <link rel="stylesheet" href="keepapp.css">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- PapaParse Library para lectura de CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>

  <!-- NAVBAR SUPERIOR -->
  <header class="app-header">
    <button id="btn-menu" class="icon-btn" aria-label="Abrir menú">
      <i class="fa-solid fa-bars"></i>
    </button>
    <h1 id="app-title">Compras</h1>
  </header>

  <!-- DRAWER / MENÚ LATERAL -->
  <div id="drawer-overlay" class="drawer-overlay"></div>
  <aside id="drawer" class="drawer">
    <div class="drawer-header">
      <h2>Menú</h2>
    </div>
    <nav class="drawer-nav">
      <button class="nav-item active" onclick="switchSection('sec-compras', 'Compras')">
        <i class="fa-solid fa-cart-shopping"></i> Compras
      </button>
      <button class="nav-item" onclick="switchSection('sec-tareas', 'Tareas')">
        <i class="fa-solid fa-list-check"></i> Tareas
      </button>
      <button class="nav-item" onclick="switchSection('sec-bbm', 'BBM Training')">
        <i class="fa-solid fa-dumbbell"></i> BBM
      </button>
      <button class="nav-item" onclick="switchSection('sec-estudio', 'Estudio')">
        <i class="fa-solid fa-book"></i> Estudio
      </button>
      <button class="nav-item" onclick="switchSection('sec-metas', 'Metas')">
        <i class="fa-solid fa-bullseye"></i> Metas
      </button>
    </nav>
  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="main-container">

    <!-- 1. COMPRAS -->
    <section id="sec-compras" class="section-content active">
      <div class="card">
        <input type="text" id="compras-search" class="search-input" placeholder="Buscar artículo...">
        <div class="stats-grid">
          <div class="stat-card">
            <span class="stat-val" id="compras-stat-total">0</span>
            <span class="stat-lbl">Total</span>
          </div>
          <div class="stat-card">
            <span class="stat-val" id="compras-stat-agotar">0</span>
            <span class="stat-lbl">Por Agotar</span>
          </div>
          <div class="stat-card">
            <span class="stat-val" id="compras-stat-agotados">0</span>
            <span class="stat-lbl">Agotados</span>
          </div>
        </div>
        <div id="compras-list" class="data-list">Cargando datos de compras...</div>
      </div>
    </section>

    <!-- 2. TAREAS -->
    <section id="sec-tareas" class="section-content">
      <div class="card">
        <input type="text" id="tareas-search" class="search-input" placeholder="Buscar tarea...">
        <div class="stats-grid">
          <div class="stat-card">
            <span class="stat-val" id="tareas-stat-total">0</span>
            <span class="stat-lbl">Total</span>
          </div>
          <div class="stat-card">
            <span class="stat-val" id="tareas-stat-pendientes">0</span>
            <span class="stat-lbl">Pendientes</span>
          </div>
          <div class="stat-card">
            <span class="stat-val" id="tareas-stat-completadas">0</span>
            <span class="stat-lbl">Completadas</span>
          </div>
        </div>
        <div id="tareas-list" class="data-list">Cargando tareas...</div>
      </div>
    </section>

    <!-- 3. BBM (ENTRENAMIENTO) -->
    <section id="sec-bbm" class="section-content">
      <!-- Selector de Sub-Sección BBM -->
      <div class="subnav-tabs">
        <button class="tab-btn active" onclick="switchBBMTab('rutina')">Rutina</button>
        <button class="tab-btn" onclick="switchBBMTab('records')">Récords</button>
        <button class="tab-btn" onclick="switchBBMTab('medidas')">Medidas</button>
      </div>

      <!-- Tab: Rutina -->
      <div id="bbm-tab-rutina" class="bbm-tab-content active">
        <div class="card">
          <select id="bbm-day-select" class="select-input">
            <option value="">Selecciona un día...</option>
          </select>
          <div id="bbm-rutina-list" class="data-list">Selecciona un día para ver los ejercicios.</div>
        </div>
      </div>

      <!-- Tab: Récords -->
      <div id="bbm-tab-records" class="bbm-tab-content">
        <div class="card">
          <div id="bbm-records-list" class="data-list">Cargando récords...</div>
        </div>
      </div>

      <!-- Tab: Medidas -->
      <div id="bbm-tab-medidas" class="bbm-tab-content">
        <div class="card">
          <div id="bbm-medidas-list" class="data-list">Cargando medidas...</div>
        </div>
      </div>
    </section>

    <!-- 4. ESTUDIO -->
    <section id="sec-estudio" class="section-content">
      <div class="card">
        <input type="text" id="estudio-search" class="search-input" placeholder="Buscar materia o tema...">
        <div id="estudio-list" class="data-list">Cargando plan de estudio...</div>
      </div>
    </section>

    <!-- 5. METAS -->
    <section id="sec-metas" class="section-content">
      <div class="card">
        <div id="goals-tabs-container" class="subnav-tabs">
          <!-- Las pestañas de años/categorías se generarán dinámicamente -->
        </div>
        <div id="goals-list" class="data-list">Cargando metas...</div>
      </div>
    </section>

  </main>

  <!-- SCRIPTS JS -->
  <script src="js/compras.js"></script>
  <script src="js/tareas.js"></script>
  <script src="js/bbm.js"></script>
  <script src="js/estudio.js"></script>
  <script src="js/goals.js"></script>
  <script src="app.js"></script>

</body>
</html>
