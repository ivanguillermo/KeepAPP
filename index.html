<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mi App - Tareas</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      padding-bottom: 80px;
    }
    h2 { font-size: 1.4rem; margin-bottom: 16px; color: var(--accent); }
    .task-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid var(--accent);
    }
    .task-info h3 { margin: 0 0 6px 0; font-size: 1rem; }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge {
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-dim);
    }
    .score-tag {
      text-align: right;
      font-size: 1.1rem;
      font-weight: bold;
      color: #4ade80;
    }
    .score-label { font-size: 0.65rem; color: var(--text-dim); display: block; }
  </style>
</head>
<body>

  <h2>📋 Mis Tareas Priorizadas</h2>
  <div id="taskList">Cargando tareas...</div>

  <script>
    const CSV_URL = "1jw9T6byYopO1uOX3iDTtD_9DFvl_2LaC-tT-Qgsu7kw";

    const VALORES = {
      urgencia: { "Hoy": 100, "Pronto": 50, "Eventualmente": 15 },
      importancia: { "Vital": 100, "Muy": 60, "Normal": 20 },
      dificultad: { "Fácil": 100, "Mediano": 50, "Difícil": 20 },
      tiempo: { "5min": 100, "1hora": 70, "1dia": 40, "1year": 10 },
      costo: { "Gratis": 100, "Poco": 80, "Barato": 60, "Caro": 30, "Muy caro": 10 }
    };

    function calcularPrioridad(t) {
      const u = VALORES.urgencia[t.Urgencia] || 0;
      const i = VALORES.importancia[t.Importancia] || 0;
      const d = VALORES.dificultad[t.Dificultad] || 0;
      const ti = VALORES.tiempo[t.Tiempo] || 0;
      const c = VALORES.costo[t.Costo] || 0;

      return Math.round((u * 0.35) + (i * 0.30) + (d * 0.15) + (ti * 0.10) + (c * 0.10));
    }

    function cargarTareas() {
      const urlSinCache = `${CSV_URL}&_nocache=${new Date().getTime()}`;

      Papa.parse(urlSinCache, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          const tareas = results.data
            .filter(t => t.Estado !== "Terminada") // Ocultar completadas
            .map(t => ({ ...t, score: calcularPrioridad(t) }))
            .sort((a, b) => b.score - a.score); // Ordenar mayor a menor prioridad

          renderizarTareas(tareas);
        }
      });
    }

    function renderizarTareas(lista) {
      const contenedor = document.getElementById("taskList");
      contenedor.innerHTML = "";

      lista.forEach(t => {
        contenedor.innerHTML += `
          <div class="task-card">
            <div class="task-info">
              <h3>${t.Tarea}</h3>
              <div class="badges">
                <span class="badge">⌛ ${t.Urgencia}</span>
                <span class="badge">🔥 ${t.Importancia}</span>
                <span class="badge">📌 ${t.Estado}</span>
              </div>
            </div>
            <div class="score-tag">
              ${t.score}
              <span class="score-label">PRIORIDAD</span>
            </div>
          </div>
        `;
      });
    }

    cargarTareas();
  </script>
</body>
</html>
